      <rect x="316.5" y="736.5" width="787" height="95" rx="12" fill="#09090b" stroke="#27272a"/>
      <text x="330" y="761" font-size="14" fill="#71717a">Message Grok. / commands, @path, Shift+Enter for a newline.</text>
      <rect x="316.5" y="846.5" width="57" height="25" rx="8" fill="none" stroke="#27272a"/>
      <text x="345" y="863" font-size="12" fill="#d4d4d8" text-anchor="middle">@ file</text>
      <rect x="381.5" y="846.5" width="63" height="25" rx="8" fill="none" stroke="#27272a"/>
      <text x="413" y="863" font-size="12" fill="#d4d4d8" text-anchor="middle">Agent</text>
      <rect x="452.5" y="846.5" width="99" height="25" rx="8" fill="none" stroke="#27272a"/>
      <text x="502" y="863" font-size="12" fill="#d4d4d8" text-anchor="middle">Effort &#183; high</text>
      <text x="1104" y="863" font-size="12" fill="#71717a" text-anchor="end">31% of context</text>

      <!-- Changes -->
      <rect x="1120" y="52" width="1" height="848" fill="#27272a"/>
      <text x="1136" y="78" font-size="10" fill="#71717a" letter-spacing="0.6">CHANGES</text>
      <text x="1196" y="78" font-size="10" fill="#52525b">&#8984;&#8679;D</text>
      <text x="1136" y="99" font-size="13" fill="#e4e4e7">eng-482-webhook-retry</text>
      <rect x="1121" y="114" width="359" height="1" fill="#27272a"/>

      <rect x="1128" y="126" width="344" height="26" rx="6" fill="#18181b"/>
      <text x="1138" y="143" font-size="11" fill="#fbbf24" class="m">M</text>
      <text x="1156" y="143" font-size="12" fill="#e4e4e7">src/webhooks/deliver.ts</text>
      <text x="1462" y="143" font-size="11" text-anchor="end" class="m"><tspan fill="#4ade80">+24</tspan><tspan fill="#f87171" dx="5">&#8722;6</tspan></text>

      <text x="1138" y="171" font-size="11" fill="#4ade80" class="m">A</text>
      <text x="1156" y="171" font-size="12" fill="#d4d4d8">src/webhooks/retry-policy.ts</text>
      <text x="1462" y="171" font-size="11" text-anchor="end" class="m" fill="#4ade80">+41</text>

      <text x="1138" y="199" font-size="11" fill="#fbbf24" class="m">M</text>
      <text x="1156" y="199" font-size="12" fill="#d4d4d8">test/webhooks.test.ts</text>
      <text x="1462" y="199" font-size="11" text-anchor="end" class="m"><tspan fill="#4ade80">+18</tspan><tspan fill="#f87171" dx="5">&#8722;2</tspan></text>

      <rect x="1136.5" y="222.5" width="327" height="250" rx="10" fill="#0c0c0e" stroke="#27272a"/>
      <text x="1150" y="245" font-size="11" fill="#a1a1aa" class="m">src/webhooks/deliver.ts</text>
      <text x="1150" y="269" font-size="11" fill="#52525b" class="m">@@ -38,7 +38,13 @@</text>
      <g class="m" font-size="11.5">
        <text x="1150" y="294" fill="#a1a1aa">  const res = await send(job)</text>
        <rect x="1137" y="299" width="326" height="20" fill="#f87171" fill-opacity="0.12"/>
        <text x="1150" y="314" fill="#fca5a5">- if (!res.ok) return done(job)</text>
        <rect x="1137" y="319" width="326" height="100" fill="#4ade80" fill-opacity="0.10"/>
        <text x="1150" y="334" fill="#86efac">+ if (!res.ok) {</text>
        <text x="1150" y="354" fill="#86efac">+   if (job.attempt &gt;= 5)</text>
        <text x="1150" y="374" fill="#86efac">+     return deadLetter(job)</text>
        <text x="1150" y="394" fill="#86efac">+   return retry(job, backoff(job))</text>
        <text x="1150" y="414" fill="#86efac">+ }</text>
        <text x="1150" y="434" fill="#a1a1aa">  return done(job)</text>
        <text x="1150" y="454" fill="#a1a1aa">}</text>
      </g>
      <text x="1136" y="500" font-size="12" fill="#71717a">3 files &#183; <tspan fill="#4ade80">+83</tspan> <tspan fill="#f87171">&#8722;8</tspan></text>
    </g>

    <rect x="0.5" y="0.5" width="1479" height="899" rx="15.5" fill="none" stroke="url(#sheen)"/>
