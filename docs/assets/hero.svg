      <rect x="250.5" y="186.5" width="28" height="17" rx="4" fill="#18181b" stroke="#3f3f46"/>
      <text x="264.5" y="198.5" font-size="10" fill="#a1a1aa" text-anchor="middle" class="m">&#8984;T</text>

      <text x="16" y="240" font-size="10" fill="#71717a" letter-spacing="0.6">API &#183; MAIN</text>
      <text x="284" y="240" font-size="10" fill="#52525b" text-anchor="end">3</text>

      <rect x="8" y="250" width="284" height="50" rx="8" fill="#18181b"/>
      <circle cx="22" cy="266" r="3" fill="#34d399"/>
      <text x="32" y="270.5" font-size="13" fill="#f4f4f5">Retry failed webhook deliveries</text>
      <rect x="32" y="279" width="54" height="15" rx="3" fill="#27272a"/>
      <text x="59" y="290" font-size="9.5" fill="#d4d4d8" text-anchor="middle" class="m">ENG-482</text>
      <text x="94" y="290.5" font-size="11" fill="#71717a">2m ago</text>

      <circle cx="22" cy="320" r="3" fill="#52525b"/>
