      <rect y="52" width="1480" height="1" fill="#27272a"/>

      <!-- Sidebar -->
      <rect x="300" y="52" width="1" height="848" fill="#27272a"/>
      <rect x="0" y="53" width="100" height="36" fill="#18181b"/>
