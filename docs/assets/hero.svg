      <text x="32" y="344.5" font-size="11" fill="#71717a">1h ago</text>

      <circle cx="22" cy="374" r="3" fill="#52525b"/>
      <text x="32" y="378.5" font-size="13" fill="#f4f4f5">Upgrade Vite to 7</text>
      <text x="32" y="398.5" font-size="11" fill="#71717a">Yesterday</text>

      <text x="16" y="440" font-size="10" fill="#71717a" letter-spacing="0.6">WORKTREE &#183; ENG-470-CHECKOUT</text>
      <text x="284" y="440" font-size="10" fill="#52525b" text-anchor="end">2</text>

      <circle cx="22" cy="466" r="3" fill="#52525b"/>
