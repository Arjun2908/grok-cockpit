      <text x="1072" y="30" font-size="11" fill="#71717a">&#8984;&#8679;T</text>

      <g fill="none" stroke="#a1a1aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1150 20h-6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M1152 18h6v6M1158 18l-8 8"/>
