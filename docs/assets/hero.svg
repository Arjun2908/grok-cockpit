      <text x="59" y="490" font-size="9.5" fill="#d4d4d8" text-anchor="middle" class="m">ENG-470</text>
      <text x="94" y="490.5" font-size="11" fill="#71717a">Tue</text>

      <circle cx="22" cy="520" r="3" fill="#52525b"/>
