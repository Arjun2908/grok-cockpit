      <text x="250" y="75" font-size="12" fill="#71717a" text-anchor="middle">Worktrees</text>
      <rect x="0" y="89" width="300" height="1" fill="#27272a"/>

      <rect x="12.5" y="102.5" width="275" height="31" rx="8" fill="#18181b" stroke="#27272a"/>
