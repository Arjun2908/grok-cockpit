<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-label="Grok Cockpit window">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif; }
    .m { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
