      <!-- Conversation -->
      <circle cx="321" cy="71" r="3.5" fill="#fbbf24"/>
      <text x="331" y="75" font-size="12" fill="#d4d4d8">Waiting for you</text>
      <text x="436" y="75" font-size="12" fill="#71717a">Context 31%</text>
      <text x="522" y="75" font-size="12" fill="#71717a" class="m">eng-482-webhook-retry</text>
      <rect x="301" y="89" width="819" height="1" fill="#27272a"/>

      <rect x="664" y="110" width="420" height="70" rx="16" fill="#f4f4f5"/>
      <text x="680" y="139" font-size="14" fill="#18181b">Webhook deliveries fail silently when the</text>
      <text x="680" y="161" font-size="14" fill="#18181b">endpoint times out. Add retries with backoff.</text>

      <text x="320" y="210" font-size="13" fill="#71717a">The worker treats a timeout as a finished job. Checking deliver.ts.</text>

      <rect x="316" y="226" width="640" height="70" rx="16" fill="#18181b"/>
      <text x="332" y="255" font-size="14" fill="#f4f4f5">The delivery worker swallows the timeout and marks the job done.</text>
      <text x="332" y="277" font-size="14" fill="#f4f4f5">I&#8217;ll add exponential backoff and a dead-letter state after five tries.</text>

      <rect x="316.5" y="312.5" width="639" height="35" rx="12" fill="#09090b" stroke="#27272a"/>
      <text x="332" y="334.5" font-size="12" fill="#e4e4e7">Read <tspan class="m" fill="#a1a1aa">src/webhooks/deliver.ts</tspan><tspan fill="#71717a" dx="8">completed</tspan></text>

      <rect x="316.5" y="355.5" width="639" height="35" rx="12" fill="#09090b" stroke="#27272a"/>
      <text x="332" y="377.5" font-size="12" fill="#e4e4e7">Edit <tspan class="m" fill="#a1a1aa">src/webhooks/deliver.ts</tspan><tspan fill="#71717a" dx="8">completed</tspan></text>
      <text x="940" y="377.5" font-size="11.5" text-anchor="end" class="m"><tspan fill="#4ade80">+24</tspan><tspan fill="#f87171" dx="6">&#8722;6</tspan></text>

      <rect x="316.5" y="398.5" width="639" height="35" rx="12" fill="#09090b" stroke="#27272a"/>
      <text x="332" y="420.5" font-size="12" fill="#e4e4e7">Create <tspan class="m" fill="#a1a1aa">src/webhooks/retry-policy.ts</tspan><tspan fill="#71717a" dx="8">completed</tspan></text>
      <text x="940" y="420.5" font-size="11.5" text-anchor="end" class="m" fill="#4ade80">+41</text>

      <rect x="316.5" y="449.5" width="639" height="113" rx="12" fill="#0c0a09" stroke="#78350f"/>
      <text x="332" y="476" font-size="13" fill="#f4f4f5">Run the webhook tests?</text>
      <text x="332" y="498" font-size="12" fill="#a1a1aa" class="m">npm test -- test/webhooks.test.ts</text>
      <rect x="332" y="516" width="72" height="30" rx="8" fill="#f4f4f5"/>
      <text x="368" y="535.5" font-size="12" fill="#18181b" text-anchor="middle">Accept</text>
      <rect x="412.5" y="516.5" width="77" height="29" rx="8" fill="none" stroke="#3f3f46"/>
      <text x="451" y="535.5" font-size="12" fill="#e4e4e7" text-anchor="middle">Decline</text>

