      <rect x="12" y="144" width="34" height="22" rx="11" fill="#f4f4f5"/>
      <text x="29" y="159" font-size="11" fill="#18181b" text-anchor="middle">All</text>
      <rect x="52" y="144" width="68" height="22" rx="11" fill="#18181b"/>
      <text x="86" y="159" font-size="11" fill="#a1a1aa" text-anchor="middle">This repo</text>
      <rect x="126" y="144" width="74" height="22" rx="11" fill="#18181b"/>
      <text x="163" y="159" font-size="11" fill="#a1a1aa" text-anchor="middle">Worktrees</text>
      <rect x="206" y="144" width="50" height="22" rx="11" fill="#18181b"/>
      <text x="231" y="159" font-size="11" fill="#a1a1aa" text-anchor="middle">Today</text>

      <rect x="12" y="178" width="276" height="34" rx="8" fill="#27272a"/>
